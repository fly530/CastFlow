services:
  icecast:
    image: libretime/icecast:2.4.4-alpine
    container_name: castflow-icecast
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD}
      - ICECAST_ADMIN_PASSWORD=${ICECAST_ADMIN_PASSWORD}
      - ICECAST_PASSWORD=${ICECAST_PASSWORD}

  liquidsoap:
    image: savonet/liquidsoap:v2.2.5
    container_name: castflow-liquidsoap
    restart: unless-stopped
    depends_on:
      - icecast
    expose:
      - "1234"
    environment:
      - ICECAST_HOST=icecast
      - ICECAST_PORT=8000
      - ICECAST_PASSWORD=${ICECAST_PASSWORD}
      - ICECAST_MOUNT=stream
      - MUSIC_DIR=/music
      - HLS_DIR=/output/hls
    volumes:
      - ./liquidsoap/radio.liq:/etc/liquidsoap/radio.liq:ro
      - ./music:/music
      - hls-ram:/output/hls
    command: ["/etc/liquidsoap/radio.liq"]

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: castflow-server
    restart: unless-stopped
    depends_on:
      - liquidsoap
      - icecast
    expose:
      - "3001"
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - LIQUIDSOAP_HOST=liquidsoap
      - LIQUIDSOAP_PORT=1234
      - ICECAST_HOST=icecast
      - ICECAST_PORT=8000
      - ICECAST_MOUNT=stream
      - MUSIC_DIR=/music
      - DATA_DIR=/data
      - BACKUP_DIR=/backups
    volumes:
      - ./music:/music
      - ./data:/data
      - ./backups:/backups

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: castflow-gateway
    restart: unless-stopped
    depends_on:
      - server
      - liquidsoap
      - icecast
    ports:
      - "80:80"
    volumes:
      - hls-ram:/usr/share/nginx/hls:ro

volumes:
  hls-ram:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=1777"
