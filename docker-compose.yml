services:
  icecast:
    image: moul/icecast:latest
    container_name: castflow-icecast
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ICECAST_SOURCE_PASSWORD=hackme
      - ICECAST_ADMIN_PASSWORD=hackme
      - ICECAST_PASSWORD=hackme

  liquidsoap:
    image: savonet/liquidsoap:v2.2.5
    container_name: castflow-liquidsoap
    restart: unless-stopped
    depends_on:
      - icecast
    ports:
      - "1234:1234"
    environment:
      - ICECAST_HOST=icecast
      - ICECAST_PORT=8000
      - ICECAST_PASSWORD=hackme
      - ICECAST_MOUNT=stream
      - MUSIC_DIR=/music
      - HLS_DIR=/output/hls
    volumes:
      - ./liquidsoap/radio.liq:/etc/liquidsoap/radio.liq:ro
      - ./music:/music
      - hls-ram:/output/hls
    command: ["/etc/liquidsoap/radio.liq"]

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: castflow-server
    restart: unless-stopped
    depends_on:
      - liquidsoap
      - icecast
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - LIQUIDSOAP_HOST=liquidsoap
      - LIQUIDSOAP_PORT=1234
      - ICECAST_HOST=icecast
      - ICECAST_PORT=8000
      - ICECAST_MOUNT=stream
      - MUSIC_DIR=/music
    volumes:
      - ./music:/music

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: castflow-gateway
    restart: unless-stopped
    depends_on:
      - server
      - liquidsoap
      - icecast
    ports:
      - "80:80"
    volumes:
      - hls-ram:/usr/share/nginx/hls:ro

volumes:
  hls-ram:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=1777"
