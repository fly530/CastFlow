name: Build and Release CastFlow

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  security-audit:
    name: Security Audit & Code Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json

      - name: Audit Backend Dependencies
        run: |
          cd server
          npm audit --audit-level=high

      - name: Audit Frontend Production Dependencies
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=high

      # ★ npm audit 只看依賴的已知漏洞，看不到自己寫的程式碼。
      # 2026-09-06 修掉的四個問題（命令注入、路徑穿越、任意刪除、root 執行）
      # audit 一個都抓不到 —— CI 綠不代表程式碼乾淨。這一步才是那四項的防線。
      - name: Backend Security Regression Tests
        run: |
          cd server
          npm ci
          npm test

      - name: Build and Verify Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  build-containers:
    name: Build & Publish Docker Containers
    needs: [security-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for server image
        id: meta-server
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/castflow-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Backend Server Image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

      - name: Extract metadata for gateway image
        id: meta-gateway
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/castflow-gateway
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Unified Gateway Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: gateway/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}
