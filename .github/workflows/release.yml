name: Build and Release CastFlow

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Dry-run Validate K8s YAMLs
        run: |
          kubectl apply --dry-run=client -f k8s/

  security-audit:
    name: Security Audit & Code Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json

      - name: Audit Backend Dependencies
        run: |
          cd server
          npm audit --audit-level=high

      - name: Audit Frontend Production Dependencies
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=high

      - name: Build and Verify Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  build-containers:
    name: Build Docker Containers
    needs: [security-audit, validate-k8s]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: castflow-server:latest

      - name: Build Unified Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: gateway/Dockerfile
          push: false
          tags: castflow-gateway:latest
