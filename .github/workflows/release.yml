name: Build and Release CastFlow

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'latest'

      # ★ 不要用 `kubectl apply --dry-run=client`。
      #
      # 它「看起來」是離線驗證，實際上仍會向 API server 索取 OpenAPI schema：
      #   failed to download openapi: Get "http://localhost:8080/openapi/v2":
      #   dial tcp [::1]:8080: connect: connection refused
      #
      # CI runner 沒有叢集，所以這個 job 從建立以來每一次都是紅的 ——
      # 連語法都沒真的驗到。而且它會把 kustomization.yaml 也當成清單去套。
      #
      # kubeconform 用內建的 JSON schema 離線驗證，-strict 會擋下多餘欄位
      # （拼錯的 key 不會再被安靜忽略）。先經 kubectl kustomize 渲染，
      # 順便確保 base 本身組得起來。
      - name: Validate K8s Manifests (offline schema validation)
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          kubectl kustomize k8s/ | /tmp/kubeconform -strict -summary -

      # radio.liq 有兩份：liquidsoap/radio.liq（Compose 掛載）與 k8s/10-configmap.yaml
      # 內嵌的那份。只改一邊會讓 Compose 與 K8s 的播放行為分歧，而且不會有任何錯誤訊息。
      - name: Verify radio.liq Is In Sync Between Compose And ConfigMap
        run: |
          sed -n '/radio.liq: |/,$p' k8s/10-configmap.yaml | tail -n +2 | sed 's/^    //' > /tmp/configmap-radio.liq
          if ! diff -u liquidsoap/radio.liq /tmp/configmap-radio.liq; then
            echo "::error::liquidsoap/radio.liq 與 k8s/10-configmap.yaml 內嵌的版本不一致，兩邊都要改。"
            exit 1
          fi

      # 15-secret.yaml 若以 .yaml 存在，就會被 `kubectl apply -f k8s/` 套用，
      # 把版控裡的佔位金鑰裝進叢集。必須維持 .yaml.example。
      - name: Ensure No Committed Secret Manifest
        run: |
          if ls k8s/*secret*.yaml >/dev/null 2>&1; then
            echo "::error::k8s/ 底下不得有會被 apply 的 Secret 清單，請改用 .yaml.example。"
            exit 1
          fi

  security-audit:
    name: Security Audit & Code Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json

      - name: Audit Backend Dependencies
        run: |
          cd server
          npm audit --audit-level=high

      - name: Audit Frontend Production Dependencies
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=high

      # ★ npm audit 只看依賴的已知漏洞，看不到自己寫的程式碼。
      # 2026-09-06 修掉的四個問題（命令注入、路徑穿越、任意刪除、root 執行）
      # audit 一個都抓不到 —— CI 綠不代表程式碼乾淨。這一步才是那四項的防線。
      - name: Backend Security Regression Tests
        run: |
          cd server
          npm ci
          npm test

      - name: Build and Verify Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  build-containers:
    name: Build & Publish Docker Containers
    needs: [security-audit, validate-k8s]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for server image
        id: meta-server
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/castflow-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Backend Server Image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

      - name: Extract metadata for gateway image
        id: meta-gateway
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/castflow-gateway
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Unified Gateway Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: gateway/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}
