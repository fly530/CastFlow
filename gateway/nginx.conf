server {
    # 8080 而非 80：容器以非 root（uid 101）執行，綁不了特權埠。
    # 對外由 Service / compose 對應回 80。
    listen 8080;
    server_name localhost;

    # 允許最大上傳 100MB 音訊檔案 (曲庫管理上傳)
    client_max_body_size 256M;

    include /etc/nginx/mime.types;
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
        audio/mpeg mp3;
    }

    # 靜態根目錄 (單一統合 SPA 前端)
    root /usr/share/nginx/html;
    index index.html index.htm;

    # 文字類回應壓縮 (JS/CSS 約縮成 1/3；API 的 JSON 也適用)。
    # 音訊 (audio/mpeg、video/mp2t) 與 ZIP 本來就壓縮過，不在清單內。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/vnd.apple.mpegurl;

    # 1. HLS 即時切片分發 (直接讀取記憶體磁碟 hls-ram，極速零代理開銷)
    # 支援 /hls/coolradio/ 頻道路徑別名
    location /hls/coolradio/ {
        alias /usr/share/nginx/hls/;
        
        # 允許跨來源存取 (CORS)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # 即時切片與播放清單停用快取
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location /hls/ {
        alias /usr/share/nginx/hls/;
        
        # 允許跨來源存取 (CORS)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # 即時切片與播放清單停用快取
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # 2. 後端 API 反向代理
    location /api/ {
        proxy_pass http://server:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 256M;
        # 上傳 ZIP 後要等伺服器解壓；預設 60 秒對大檔不夠
        proxy_read_timeout 300s;
    }

    # 打包／還原完整備份 ZIP 可能要好幾分鐘 (曲庫越大越久)，預設 60 秒會先回 504、
    # 但伺服器其實還在打包，使用者以為失敗又按一次。下載大檔也不需要整份先緩衝到 nginx 磁碟。
    # 不帶結尾斜線：寫成 /api/backups/ 的話，nginx 會把 /api/backups (建立、列出備份) 301 轉到加斜線的網址。
    # proxy_pass 不帶 URI，請求路徑原樣轉給後端。
    location /api/backups {
        proxy_pass http://server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 256M;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }

    # 3. WebSocket 即時通訊反向代理
    location /ws {
        proxy_pass http://server:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # 4. Icecast 廣播串流反向代理 (MP3 直播)
    location /stream {
        proxy_pass http://icecast:8000/stream;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 5. Vite 打包產物：檔名含內容雜湊，內容一變檔名就變，可以放心長期快取
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 每次都要重新驗證，否則部署新版後瀏覽器還拿著指向舊 JS 的首頁
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 6. 單一 SPA 統一路由 (所有前台與 /admin 路由皆由 React 前端無縫接管)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
