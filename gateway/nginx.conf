server {
    listen 80;
    server_name localhost;

    # 允許最大上傳 100MB 音訊檔案 (曲庫管理上傳)
    client_max_body_size 100M;

    include /etc/nginx/mime.types;
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
        audio/mpeg mp3;
    }

    # 靜態根目錄 (單一統合 SPA 前端)
    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. HLS 即時切片分發 (直接讀取記憶體磁碟 hls-ram，極速零代理開銷)
    location /hls/ {
        alias /usr/share/nginx/hls/;
        
        # 允許跨來源存取 (CORS)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # 即時切片與播放清單停用快取
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # 2. 後端 API 反向代理
    location /api/ {
        proxy_pass http://server:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100M;
    }

    # 3. WebSocket 即時通訊反向代理
    location /ws {
        proxy_pass http://server:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # 4. Icecast 廣播串流反向代理 (MP3 直播)
    location /stream {
        proxy_pass http://icecast:8000/stream;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 5. 單一 SPA 統一路由 (所有前台與 /admin 路由皆由 React 前端無縫接管)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
