apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: castflow
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      # 1. 統一入口 Nginx (前端 Web SPA、HLS、串流、API 反向代理)
      - name: gateway
        image: castflow-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        # 直接由記憶體共享 tmpfs 讀取 HLS 切片，零磁碟 I/O、極致效能
        - name: hls-ram
          mountPath: /usr/share/nginx/hls
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 15

      # 2. 廣播核心排程推流引擎 Liquidsoap (與 Gateway 同 Pod 共享記憶體 tmpfs)
      - name: liquidsoap
        image: savonet/liquidsoap:v2.2.5
        args: ["/etc/liquidsoap/radio.liq"]
        ports:
        - containerPort: 1234
          name: telnet
        env:
        - name: ICECAST_HOST
          value: "icecast"
        - name: ICECAST_PORT
          value: "8000"
        # 推流用的是 Icecast 的 source-password，與 30-icecast.yaml 同一個 Secret key。
        # 兩邊必須指向同一把，否則 liquidsoap 推流被回 401，/stream 全啞（HLS 仍正常，難察覺）。
        - name: ICECAST_SOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: castflow-secrets
              key: icecast-source-password
        - name: ICECAST_MOUNT
          value: "stream"
        - name: MUSIC_DIR
          value: "/music"
        - name: HLS_DIR
          value: "/output/hls"
        volumeMounts:
        - name: config-volume
          mountPath: /etc/liquidsoap
        - name: music-volume
          mountPath: "/music"
        - name: hls-ram
          mountPath: /output/hls
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

      volumes:
      # 記憶體磁碟 (tmpfs 64MB)，免去 NVMe 每日頻繁寫入切片之損耗，並天然解決跨節點調度切片遺失問題
      - name: hls-ram
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      - name: config-volume
        configMap:
          name: liquidsoap-config
      - name: music-volume
        persistentVolumeClaim:
          claimName: radio-music-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: castflow
  labels:
    app: gateway
spec:
  # 適用於 K3s (內建 ServiceLB) 及雲端 Kubernetes 平台 (GKE/EKS/AKS)
  # 若在純自建裸機環境，亦可改為 NodePort
  type: LoadBalancer
  selector:
    app: gateway
  ports:
  - port: 80
    targetPort: 80
    name: http
