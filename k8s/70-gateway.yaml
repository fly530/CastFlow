apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: castflow
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      # ★ fsGroup 必須與 60-server.yaml 相同。
      # server 與 gateway 兩個 Pod 掛的是同一個 radio-music-pvc；fsGroup 會對
      # 掛載點做遞迴 chgrp，兩邊給不同值會互相覆蓋。統一用 1000（server 的
      # uid/gid）。liquidsoap 以 uid 10000/gid 10001 執行，fsGroup 會把 1000
      # 加為附加群組，所以它照樣讀寫得到曲庫。
      securityContext:
        fsGroup: 1000
      containers:
      # 1. 統一入口 Nginx (前端 Web SPA、HLS、串流、API 反向代理)
      - name: gateway
        image: ghcr.io/fly530/castflow-gateway:latest
        imagePullPolicy: IfNotPresent
        # nginx-unprivileged 以 uid 101 執行，聽 8080（非特權埠）。
        # Service 仍對外提供 80，見本檔最下方。
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false   # nginx 需寫 /tmp 與 /var/cache/nginx
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        # 直接由記憶體共享 tmpfs 讀取 HLS 切片，零磁碟 I/O、極致效能
        - name: hls-ram
          mountPath: /usr/share/nginx/hls
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        # ★ startupProbe 探的是「HLS 真的產出來了」，不是「nginx 活著」。
        #
        # 沒有這個探針時 rollout 的失敗序列是：
        #   1. 新 pod 啟動，nginx 一秒內回 200
        #   2. readinessProbe 探 / → 判定就緒
        #   3. k8s 開始終止舊 pod
        #   4. 但同 pod 的 liquidsoap 還沒接上 Icecast、tmpfs 裡一個切片都沒有
        #   5. 聽眾被導到一個空的 HLS 目錄
        #
        # 探針探的東西，跟服務真正提供的東西不是同一件事。多容器 Pod 的
        # 就緒判斷必須反映整個 Pod 的服務能力，不能只探最快就緒的那個容器。
        #
        # 為什麼是 startupProbe 而不是把 readinessProbe 改成探這個路徑：
        # readinessProbe 探 /hls/live.m3u8 的話，日後 liquidsoap 任何時候掛掉，
        # 整個 gateway 都會被踢出 Service —— 連管理後台都進不去，而那正是
        # 用來診斷的地方。startupProbe 只在啟動階段生效，成功一次後就交還給
        # readinessProbe，剛好只解決 rollout 這個場景，沒有副作用。
        #
        # 音樂庫是空的也不會卡住：radio.liq 的 mksafe 會補靜音，切片照樣產生。
        startupProbe:
          httpGet:
            path: /hls/live.m3u8
            port: 8080
          periodSeconds: 5
          failureThreshold: 30    # 150 秒；liquidsoap 啟動 + 首個切片通常 10~30 秒

        # startupProbe 成功後才開始執行。探 / 而非 /hls/，理由見上。
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 15

      # 2. 廣播核心排程推流引擎 Liquidsoap (與 Gateway 同 Pod 共享記憶體 tmpfs)
      - name: liquidsoap
        image: savonet/liquidsoap:v2.2.5
        args: ["/etc/liquidsoap/radio.liq"]
        # 上游映像本來就以 uid 10000 執行，這裡把它變成叢集強制的保證，
        # 而不是「碰巧如此」—— 日後換 tag 若上游改回 root 會直接被擋下。
        securityContext:
          runAsNonRoot: true
          runAsUser: 10000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 1234
          name: telnet
        env:
        - name: ICECAST_HOST
          value: "icecast"
        - name: ICECAST_PORT
          value: "8000"
        # 推流用的是 Icecast 的 source-password，與 30-icecast.yaml 同一個 Secret key。
        # 兩邊必須指向同一把，否則 liquidsoap 推流被回 401，/stream 全啞（HLS 仍正常，難察覺）。
        - name: ICECAST_SOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: castflow-secrets
              key: icecast-source-password
        - name: ICECAST_MOUNT
          value: "stream"
        - name: MUSIC_DIR
          value: "/music"
        - name: HLS_DIR
          value: "/output/hls"
        volumeMounts:
        - name: config-volume
          mountPath: /etc/liquidsoap
        - name: music-volume
          mountPath: "/music"
        - name: hls-ram
          mountPath: /output/hls
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

      volumes:
      # 記憶體磁碟 (tmpfs 64MB)，免去 NVMe 每日頻繁寫入切片之損耗，並天然解決跨節點調度切片遺失問題
      - name: hls-ram
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      - name: config-volume
        configMap:
          name: liquidsoap-config
      - name: music-volume
        persistentVolumeClaim:
          claimName: radio-music-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: castflow
  labels:
    app: gateway
spec:
  # 採用標準 ClusterIP 透過 Ingress 統一反向代理暴露，不搶佔節點實體埠號，完美避免 Port 衝突
  # 若叢集無 Ingress Controller 且欲直接透過節點 IP 存取，可切換為 NodePort
  type: ClusterIP
  selector:
    app: gateway
  ports:
  - port: 80
    targetPort: 8080   # 容器內是 8080（非 root nginx），Service 對內提供 80
    name: http
