apiVersion: v1
kind: ConfigMap
metadata:
  name: web-hls-nginx-conf
  namespace: castflow
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            location ~* \.m3u8$ {
                expires -1;
                add_header Cache-Control no-cache;
                add_header Access-Control-Allow-Origin * always;
            }

            location ~* \.ts$ {
                expires 10s;
                add_header Cache-Control max-age=10;
                add_header Access-Control-Allow-Origin * always;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-hls
  namespace: castflow
  labels:
    app: web-hls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-hls
  template:
    metadata:
      labels:
        app: web-hls
    spec:
      containers:
      - name: web-hls
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: hls-volume
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: hls-volume
        persistentVolumeClaim:
          claimName: radio-hls-pvc
      - name: nginx-conf
        configMap:
          name: web-hls-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: web-hls
  namespace: castflow
  labels:
    app: web-hls
spec:
  selector:
    app: web-hls
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP
