apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquidsoap
  namespace: castflow
  labels:
    app: liquidsoap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: liquidsoap
  template:
    metadata:
      labels:
        app: liquidsoap
    spec:
      containers:
      - name: liquidsoap
        image: savonet/liquidsoap:v2.2.5
        args: ["/etc/liquidsoap/radio.liq"]
        env:
        - name: ICECAST_HOST
          value: "icecast"
        - name: ICECAST_PORT
          value: "8000"
        - name: ICECAST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: castflow-secrets
              key: icecast-password
        - name: ICECAST_MOUNT
          value: "stream"
        - name: MUSIC_DIR
          value: "/music"
        - name: HLS_DIR
          value: "/output/hls"
        ports:
        - containerPort: 1234
          name: telnet
        volumeMounts:
        - name: config-volume
          mountPath: /etc/liquidsoap
        - name: music-volume
          mountPath: /music
        - name: hls-volume
          mountPath: /output/hls
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      volumes:
      - name: config-volume
        configMap:
          name: liquidsoap-config
      - name: music-volume
        persistentVolumeClaim:
          claimName: radio-music-pvc
      - name: hls-volume
        persistentVolumeClaim:
          claimName: radio-hls-pvc
